# Χτίζει αυτόματα το APK του DjFah Radio και το δημοσιεύει στις Releases.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "pc/app/web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Αρχεία εφαρμογής (ίδια οθόνη με τον υπολογιστή)
        working-directory: android-app
        run: |
          npm ci
          rm -rf www && mkdir -p www
          cp -r ../pc/app/web www/web
          cp ../pc/app/web/index.html www/index.html
          cp ../stations.json www/stations.json
          npx cap sync android

      - name: Χτίσιμο APK
        working-directory: android-app/android
        env:
          DJFAH_VERSION_CODE: ${{ github.run_number }}
          DJFAH_VERSION_NAME: 1.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
            # Δημοσίευση του σφάλματος ως σημείωση, ώστε να διαβάζεται χωρίς λήψη αρχείων
            grep -E "error:|e: |What went wrong|Could not|> |FAILURE|\.java:[0-9]+" build.log | grep -v "^> Task" | head -60 > errs.txt || true
            [ -s errs.txt ] || tail -60 build.log > errs.txt
            msg=$(sed -e 's/%/%25/g' errs.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::${msg}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DjFah-Radio.apk"

      - name: Δημοσίευση στις Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: DjFah Radio 1.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Εγκατάσταση στο κινητό:** πάτα το αρχείο **DjFah-Radio.apk** παρακάτω, κατέβασέ το και άνοιξέ το.
            Την πρώτη φορά το Android θα ζητήσει να επιτρέψεις την εγκατάσταση από αυτή την πηγή.
          files: DjFah-Radio.apk
